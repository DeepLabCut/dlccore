[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=80",
  "setuptools-scm>=8",
]

[project]
name = "dlccore"
dynamic = ["version"]
description = "Shared core of the DeepLabCut stack"
readme = { file = "README.md", content-type = "text/markdown" }
license = "LGPL-3.0-only"
license-files = [ "LICENSE", "NOTICE.yml" ]
authors = [ { name = "The DeepLabCut team", email = "admin@deeplabcut.org" } ]
requires-python = ">=3.10"
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dynamic = [ "version" ]
dependencies = []
urls.Homepage = "https://github.com/DeepLabCut/dlc-core"
urls.Repository = "https://github.com/DeepLabCut/dlc-core"

[project.urls]
Homepage = "https://github.com/DeepLabCut/dlccore"
Repository = "https://github.com/DeepLabCut/dlccore"

[tool.setuptools.packages.find]
include = ["dlccore*"]

[tool.setuptools_scm]

[tool.ruff]
target-version = "py310"
line-length = 120
format.docstring-code-format = true
lint.select = [
  "ANN",
  "ARG",
  "B",
  "C4",
  "D",
  "DTZ",
  "E",
  "ERA",
  "F",
  "I",
  "N",
  "PIE",
  "RET",
  "RUF",
  "SIM",
  "UP",
]
lint.ignore = [
  "ANN401",
  "B007",
  "D100",
  "D101",
  "D102",
  "D104",
  "D106",
  "D107",
  "D202",
  "E741",
  "N803",
  "N806",
]
lint.per-file-ignores."__init__.py" = [ "E402", "F401" ]
lint.per-file-ignores."tests/**" = [ "D" ]
lint.pydocstyle.convention = "google"

[tool.pyproject-fmt]
max_supported_python = "3.12"
